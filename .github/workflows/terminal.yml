name: ⌨️ Perfil

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06h (BRT): novo comando no terminal + dashboard atualizado (inclui contribuições privadas)
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/terminal/**", ".github/data/**", ".github/workflows/terminal.yml"]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 🖥️ Terminal + dashboard
        run: node .github/terminal/shell.mjs
        env:
          # METRICS_TOKEN (PAT com repo + read:org) faz o dashboard enxergar os repositórios privados.
          # Sem ele, cai no token padrão e mostra só a atividade pública.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 💾 Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets .github/terminal/github.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza perfil [bot]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
