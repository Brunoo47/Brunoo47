name: 🎮 4 em Linha

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Jogadas em fila, uma de cada vez. Se uma execução for descartada da fila,
# a próxima processa todas as issues abertas, então nenhuma jogada se perde.
concurrency:
  group: 4emlinha
  cancel-in-progress: false

jobs:
  jogar:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '4emlinha|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: ♟️ Processar jogadas
        run: node .github/scripts/connect4.mjs process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLIES_FILE: ${{ runner.temp }}/replies.json

      - name: 💾 Salvar tabuleiro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json assets/4emlinha-*.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "🎮 4 em Linha: nova jogada"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 3)); done
          exit 1

      - name: 💬 Responder jogadores
        run: 'if [ -f "$REPLIES_FILE" ]; then node .github/scripts/connect4.mjs reply; else echo "nada a responder"; fi'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLIES_FILE: ${{ runner.temp }}/replies.json
