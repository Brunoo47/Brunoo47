name: 🛰️ Atualizar perfil

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06h (BRT)
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["assets/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 📊 Dashboard
        run: node .github/scripts/dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: 🐍 Cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#6d28d9&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#8b5cf6,#6d28d9
            assets/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#2e1f5e,#4c3a8f,#7c5cd6,#a78bfa

      - name: 🏙️ Contribuições em 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 📦 Organizar
        run: |
          cp profile-3d-contrib/profile-night-rainbow.svg assets/3d-dark.svg
          cp profile-3d-contrib/profile-season-animate.svg assets/3d-light.svg
          rm -rf profile-3d-contrib

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: atualiza dashboard do perfil 🤖"
          file_pattern: assets/*
